<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실시간 시세 · morningRoutine</title>
<style>
  :root {
    --bg: #0E1320;
    --surface: #161C2C;
    --surface-2: #1C2337;
    --border: #2A3249;
    --text: #E8EAF0;
    --text-dim: #939CB5;
    --text-faint: #626D8A;
    --accent: #FF8F5E;
    --up: #F0555C;
    --down: #6C93FF;
    --ok: #4CAF7D;
    --ok-soft: #1B3327;
    --err: #F0555C;
    --err-soft: #3A1E22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 2rem 1.25rem 3rem;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.4rem; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.68rem; color: var(--text-dim); font-weight: 600; }
  h1 { margin: 0.25rem 0 0; font-size: 1.4rem; font-weight: 700; }

  .status { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); animation: pulse 2s ease-in-out infinite; }
  .dot.stale { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-faint); padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  thead th.num, tbody td.num { text-align: right; }
  tbody td { padding: 0.85rem 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 600; }
  .ticker { color: var(--text-faint); font-size: 0.78rem; }
  .price { font-size: 1.05rem; font-weight: 700; }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .change.flat { color: var(--text-dim); }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-faint); font-size: 0.9rem; }

  footer { color: var(--text-faint); font-size: 0.76rem; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow mono">MORNINGROUTINE · LOCAL</div>
        <h1>실시간 시세</h1>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="status-text">연결 중…</span></div>
    </header>

    <table>
      <thead>
        <tr>
          <th>종목명</th>
          <th class="num">현재가</th>
          <th class="num">전일대비</th>
          <th class="num">거래량</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">시세를 불러오는 중입니다…</td></tr>
      </tbody>
    </table>

    <footer id="updated"></footer>
  </div>

<script>
  const POLL_MS = 3000;
  const rowsEl = document.getElementById("rows");
  const dotEl = document.getElementById("dot");
  const statusEl = document.getElementById("status-text");
  const updatedEl = document.getElementById("updated");

  function fmtTime(ts) {
    if (!ts) return "-";
    return new Date(ts * 1000).toLocaleTimeString("ko-KR", { hour12: false });
  }

  function signClass(sign) {
    if (sign === "1" || sign === "2") return "up";
    if (sign === "4" || sign === "5") return "down";
    return "flat";
  }

  async function tick() {
    try {
      const res = await fetch("/api/prices", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      dotEl.className = "dot live";
      statusEl.textContent = "실시간 연결됨 · " + POLL_MS / 1000 + "초 간격";
      updatedEl.textContent = "마지막 갱신: " + fmtTime(data.updated_at);

      if (!data.prices || data.prices.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="4" class="empty">시세 데이터가 없습니다. WATCHLIST 설정을 확인하세요.</td></tr>';
        return;
      }

      rowsEl.innerHTML = data.prices.map((p) => {
        const cls = signClass(p.sign);
        const changeSign = p.change > 0 ? "+" : "";
        return `<tr>
          <td><div class="name">${p.name || p.ticker}</div><div class="ticker mono">${p.ticker}</div></td>
          <td class="num price mono">${p.price.toLocaleString("ko-KR")}원</td>
          <td class="num change ${cls} mono">${changeSign}${p.change.toLocaleString("ko-KR")} (${changeSign}${p.change_rate.toFixed(2)}%)</td>
          <td class="num mono">${p.volume.toLocaleString("ko-KR")}</td>
        </tr>`;
      }).join("");
    } catch (e) {
      dotEl.className = "dot stale";
      statusEl.textContent = "연결 끊김 - 서버 확인 필요";
    }
  }

  tick();
  setInterval(tick, POLL_MS);
</script>
</body>
</html>
